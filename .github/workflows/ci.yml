name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep, shellcheck, and PyYAML
        run: sudo apt-get install -y -qq ripgrep shellcheck python3-yaml >/dev/null

      - name: shellcheck
        run: shellcheck skills/iphone-duo-design/scripts/*.sh

      - name: SKILL.md frontmatter and size
        run: |
          python3 - <<'PY'
          import json, os, re, sys, yaml
          d = "skills/iphone-duo-design"
          text = open(f"{d}/SKILL.md").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert m, "SKILL.md must start with YAML frontmatter"
          fm = yaml.safe_load(m.group(1))
          errors = []
          if fm.get("name") != os.path.basename(d): errors.append("name must match the folder name")
          if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", fm.get("name", "")) or len(fm["name"]) > 64: errors.append("invalid name")
          desc = fm.get("description", "")
          if not 1 <= len(desc) <= 1024: errors.append(f"description is {len(desc)} chars (1-1024)")
          if re.search(r"[<>]", desc): errors.append("description must not contain angle brackets")
          if len(fm.get("compatibility", "")) > 500: errors.append("compatibility over 500 chars")
          if "," in str(fm.get("allowed-tools", "")): errors.append("allowed-tools is space-separated, not comma-separated")
          meta = fm.get("metadata", {})
          if not all(isinstance(v, str) for v in meta.values()): errors.append("metadata values must be strings")
          top = re.search(r"^## \[(\d+\.\d+\.\d+)\]", open("CHANGELOG.md").read(), re.M).group(1)
          if meta.get("version") != top: errors.append(f"metadata.version {meta.get('version')} != CHANGELOG {top}")
          lines = text.count("\n")
          print(f"SKILL.md: {lines} lines, description {len(desc)} chars")
          if lines > 160: errors.append("SKILL.md over 160 lines")
          for link in re.findall(r"\]\(((?:references|scripts)/[^)#]+)\)", text):
              if not os.path.exists(f"{d}/{link}"): errors.append(f"broken link {link}")
          sys.exit("\n".join(errors) if errors else 0)
          PY

      - name: Evals are well-formed
        run: |
          python3 - <<'PY'
          import json, os, sys
          errors = []
          evals = json.load(open("tests/evals/evals.json"))
          for e in evals["evals"]:
              if not e.get("expectations"): errors.append(f"eval {e['id']} has no expectations")
              errors += [f"eval {e['id']}: missing {f}" for f in e.get("files", []) if not os.path.exists(f)]
          trig = json.load(open("tests/evals/trigger_evals.json"))
          pos = sum(t["should_trigger"] for t in trig)
          if pos == 0 or pos == len(trig): errors.append("trigger evals need both positive and negative queries")
          print(f"{len(evals['evals'])} evals, {len(trig)} trigger queries ({pos} positive)")
          sys.exit("\n".join(errors) if errors else 0)
          PY

      - name: Audit catches every marked anti-pattern and nothing in clean code
        run: |
          S=skills/iphone-duo-design/scripts/audit_duo_readiness.sh
          for tool in rg grep; do
            [ "$tool" = grep ] && export AUDIT_NO_RG=1
            set +e
            clean=$(bash "$S" tests/fixtures/Clean -q -n 0); clean_code=$?
            patterns=$(bash "$S" tests/fixtures/Patterns -q -n 0); patterns_code=$?
            set -e
            [ "$clean_code" -eq 0 ] || { echo "$tool: false positives in tests/fixtures/Clean:"; echo "$clean"; exit 1; }
            [ "$patterns_code" -eq 1 ] || { echo "$tool: expected exit 1 on Patterns, got $patterns_code"; exit 1; }
            expected=$(grep -rn 'duo-bad' tests/fixtures/Patterns | grep -v 'must be flagged' | cut -d: -f1,2 | sed 's#^tests/fixtures/Patterns/##' | sort -u)
            got=$(printf '%s\n' "$patterns" | sed -n 's/^    //p' | cut -d: -f1,2 | sort -u)
            missed=$(comm -23 <(echo "$expected") <(echo "$got"))
            unexpected=$(comm -13 <(echo "$expected") <(echo "$got"))
            [ -z "$missed" ] || { echo "$tool missed:"; echo "$missed"; exit 1; }
            [ -z "$unexpected" ] || { echo "$tool flagged unmarked lines:"; echo "$unexpected"; exit 1; }
            echo "$tool: $(echo "$expected" | wc -l) marked lines caught, clean fixture clean"
          done

      - name: Audit output stays small on a large tree
        run: |
          S=skills/iphone-duo-design/scripts/audit_duo_readiness.sh
          big=$(mktemp -d)
          for i in $(seq 1 200); do
            for f in tests/fixtures/*/*.swift; do cp "$f" "$big/$i-$(basename "$f")"; done
          done
          set +e
          full=$(bash "$S" "$big" -q); summary=$(bash "$S" "$big" -s)
          set -e
          echo "default: $(printf '%s' "$full" | wc -c) bytes, summary: $(printf '%s' "$summary" | wc -c) bytes"
          [ "$(printf '%s' "$full" | wc -c)" -lt 14000 ] || { echo "default output not capped"; exit 1; }
          [ "$(printf '%s\n' "$summary" | grep -c '^    ')" -eq 0 ] || { echo "summary printed matches"; exit 1; }

      - name: Same results with and without ripgrep
        run: |
          S=skills/iphone-duo-design/scripts/audit_duo_readiness.sh
          set +e
          with_rg=$(bash "$S" tests/fixtures -n 0)
          without_rg=$(AUDIT_NO_RG=1 bash "$S" tests/fixtures -n 0)
          set -e
          [ "$with_rg" = "$without_rg" ] || { diff <(echo "$with_rg") <(echo "$without_rg"); exit 1; }

      - name: Audit handles spaces and colons in paths
        run: |
          S=skills/iphone-duo-design/scripts/audit_duo_readiness.sh
          d=$(mktemp -d)/"My App"
          mkdir -p "$d/Sub Dir" "$d/Pods/X"
          printf 'let w = UIScreen.main.bounds.width\n' > "$d/Sub Dir/A B.swift"
          printf 'let w = UIScreen.main.bounds.width\n' > "$d/Pods/X/Skip.swift"
          printf '.toolbar {\n  ToolbarItem {\n    Button { } label: { Image(systemName: "star") }\n  }\n}\n' > "$d/Sub Dir/odd:name.swift"
          for tool in rg grep; do
            [ "$tool" = grep ] && export AUDIT_NO_RG=1
            set +e; out=$(bash "$S" "$d" -q -n 0); code=$?; set -e
            echo "$out"
            [ "$code" -eq 1 ] || { echo "$tool: expected exit 1, got $code"; exit 1; }
            echo "$out" | grep -q 'A B.swift:1:' || { echo "$tool: missed file with spaces"; exit 1; }
            echo "$out" | grep -q 'odd:name.swift:3:' || { echo "$tool: missed file with a colon"; exit 1; }
            ! echo "$out" | grep -q Skip.swift || { echo "$tool: scanned Pods"; exit 1; }
          done

      - name: No remote-install patterns in the skill
        run: |
          if grep -rnE 'curl |wget |\| *(ba)?sh|git clone|rm -rf' skills/ README.md; then
            echo "Remote install or destructive command found"; exit 1
          fi
