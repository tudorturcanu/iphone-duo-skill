name: HIG drift

# Apple's "Designing for iPhone Duo" article and the iOS 27.1 APIs can change. These jobs fail
# when they do, so references/ and SKILL.md get re-checked. The launch sources (news post, App Store Connect
# specs, Xcode status, the "Three steps" prepare page) are compared by a few facts. Only hashes, section headings,
# numbers, and availability metadata are stored, never Apple's text.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the article with the recorded section hashes
        run: python3 tests/check_hig.py

  apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Apple API the skill names still exists with the same availability
        run: python3 tests/check_apple_apis.py

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launch news, App Store specs, and Xcode release status and issues still match the references
        run: python3 tests/check_apple_sources.py
